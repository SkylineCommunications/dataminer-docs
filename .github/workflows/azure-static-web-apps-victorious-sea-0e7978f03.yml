name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

jobs:
  build_job:
    runs-on: windows-latest
    name: Build Job
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Install DocFX
        run: dotnet tool update -g docfx
        env:
          CI: true
      - name: Restore NuGet
        run: dotnet restore "src/NuGetPackages"
      - name: Test documentation metadata validator
        run: .\scripts\test-validate-documentation-metadata.ps1
        shell: powershell
      - name: Test documentation metadata migration
        run: .\scripts\test-migrate-documentation-metadata.ps1
        shell: powershell
      - name: Validate documentation metadata
        run: |
          $added = @(git diff --name-only --diff-filter=A HEAD^ HEAD | Where-Object {
            $_ -match '^[^/]+\.md$' -or $_ -match '^(contributing|dataminer|develop|release-notes|solutions|tutorials)/.+\.md$'
          })
          if ($added.Count -gt 0) {
            .\scripts\validate-documentation-metadata.ps1 -RepositoryRoot . -Path $added -RequireVersion1
          }
          .\scripts\validate-documentation-metadata.ps1 -RepositoryRoot .
        shell: powershell
      - name: Validate D2.2 target metadata
        run: .\scripts\migrate-documentation-metadata.ps1 -RepositoryRoot . -CheckOnly -ReportPath .\d2-2-metadata-migration-report.json
        shell: powershell
      - name: Test documentation corpus audit
        run: .\scripts\test-audit-docs-baseline.ps1
        shell: powershell
      - name: Test generated metadata provenance
        run: .\scripts\test-generated-metadata-provenance.ps1
        shell: powershell
      - name: Test AI content manifest
        run: .\scripts\test-ai-content-manifest.ps1
        shell: powershell
      - name: Test segmented sitemaps
        run: .\scripts\test-segmented-sitemaps.ps1
        shell: powershell
      - name: Build
        run: dotnet build "src/NuGetPackages" --configuration Release
      - name: Build Documentation
        id: build-documentation
        run: |
          docfx metadata
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\generate-generated-metadata-provenance.ps1 -RepositoryRoot . -OutputPath .\_artifacts\generated-metadata-provenance.json -SourceRevision $env:GITHUB_SHA -RequireGeneratedOutputs
          .\scripts\validate-generated-metadata-provenance.ps1 -RepositoryRoot . -Path .\_artifacts\generated-metadata-provenance.json
          .\scripts\generate-ai-content-manifest.ps1 -RepositoryRoot . -OutputPath .\_artifacts\ai-content-manifest.json -SourceRevision $env:GITHUB_SHA
          .\scripts\validate-ai-content-manifest.ps1 -RepositoryRoot . -Path .\_artifacts\ai-content-manifest.json
          docfx build --warningsAsErrors
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\generate-segmented-sitemaps.ps1 -RepositoryRoot . -SitePath .\_site -GeneratedProvenancePath .\_artifacts\generated-metadata-provenance.json -OutputPath .\_artifacts\segmented-sitemap-report.json -SourceRevision $env:GITHUB_SHA
          .\scripts\validate-segmented-sitemaps.ps1 -RepositoryRoot . -SitePath .\_site -ReportPath .\_artifacts\segmented-sitemap-report.json
        shell: powershell
      - name: Retain generated metadata provenance
        uses: actions/upload-artifact@v7
        with:
          name: generated-metadata-provenance-${{ github.sha }}
          path: _artifacts/generated-metadata-provenance.json
          retention-days: 14
      - name: Retain commit-addressed AI content manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'SkylineCommunications/dataminer-docs'
        uses: actions/upload-artifact@v7
        with:
          name: ai-content-manifest-${{ github.sha }}
          path: _artifacts/ai-content-manifest.json
          retention-days: 90
      - name: Retain segmented sitemap report
        uses: actions/upload-artifact@v7
        with:
          name: segmented-sitemap-report-${{ github.sha }}
          path: _artifacts/segmented-sitemap-report.json
          retention-days: 14
      - name: Audit documentation corpus
        run: .\scripts\audit-docs-baseline.ps1 -RepositoryRoot . -SitePath _site -OutputPath docs-corpus-baseline.generated.json -SourceRevision $env:GITHUB_SHA
        shell: powershell
      - name: Retain commit-addressed documentation corpus baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'SkylineCommunications/dataminer-docs'
        uses: actions/upload-artifact@v7
        with:
          name: docs-corpus-baseline-${{ github.sha }}
          path: docs-corpus-baseline.generated.json
          retention-days: 90
      - name: Zip artifact for deployment
        run: Compress-Archive -Path _site/* -DestinationPath .\_site.zip
      - name: Retain site validation artifact
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: _site.zip
          retention-days: 14
  
  deploy_job_Storage_Account:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'SkylineCommunications/dataminer-docs'
    runs-on: ubuntu-latest
    needs: build_job
    name: Deploy Job to Storage account
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: .
      - name: Unzip artifact for deployment
        run: Expand-Archive -Path _site.zip -DestinationPath ./_site
        shell: pwsh
      - name: Delete files that should not be indexed by Azure Search Service
        run: |
          rm -f ./_site/404.html
          rm -f ./_site/README.html
          find ./_site -name 'toc.html' -type f -delete
      - name: Upload the new files
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_ACCOUNT_DOCS_CONNECTION_STRING }}
        run: |
          wget https://aka.ms/downloadazcopy-v10-linux
          tar -xvf downloadazcopy-v10-linux
          sudo cp ./azcopy_linux_amd64_*/azcopy /usr/bin/
          azcopy --version
          az storage blob sync \
            --source _site \
            --container docs
      #       --connection-string ${{ secrets.AZURE_STORAGE_ACCOUNT_DOCS_CONNECTION_STRING }}
      # - name: Upload the new files
      #   uses: bacongobbler/azure-blob-storage-upload@main
      #   with:
      #     source_dir: _site
      #     container_name: docs
      #     connection_string: ${{ secrets.AZURE_STORAGE_ACCOUNT_DOCS_CONNECTION_STRING }}
      #     # Sync: true keeps the source and destination in sync,
      #     # otherwise changed files and new would be pushed, but deleted wouldn't be removed.
      #     sync: 'true'
  
  deploy_job_SA_SWA:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'SkylineCommunications/dataminer-docs'
    runs-on: ubuntu-latest
    needs: build_job
    name: Deploy Job to SA with SWA and FD
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: .
      - name: Unzip artifact for deployment
        run: Expand-Archive -Path _site.zip -DestinationPath ./_site
        shell: pwsh
      - name: Upload the new files
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_SA_DOCS_SWA }}
        run: |
          wget https://aka.ms/downloadazcopy-v10-linux
          tar -xvf downloadazcopy-v10-linux
          sudo cp ./azcopy_linux_amd64_*/azcopy /usr/bin/
          azcopy --version
          az storage blob sync \
            --source _site \
            --container '$web'
      #      --connection-string ${{ secrets.AZURE_SA_DOCS_SWA }} 
      # - name: Upload the new files
      #   uses: bacongobbler/azure-blob-storage-upload@main
      #   with:
      #     source_dir: _site
      #     container_name: $web
      #     connection_string: ${{ secrets.AZURE_SA_DOCS_SWA }}
      #     sync: 'true'
          
  reindex_azure_search:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'SkylineCommunications/dataminer-docs'
    runs-on: ubuntu-latest
    needs: deploy_job_Storage_Account
    name: Re-index azure search
    steps:
    - name: Azure Cognitive Search Reindex
      # You may pin to the exact commit or the version.
      # uses: andrewconnell/azure-search-index@ac64a40924771a415e01d52db4c1d557ecd3a99f
      uses: andrewconnell/azure-search-index@2.0.3
      with:
        # Name of the Azure Cognitive Search resource.
        azure-search-instance: docs-srch
        # Search indexer to reindex
        azure-search-indexer: indexer-1745835640388
        # Admin key used to connect to Azure Cognitive Search instance
        azure-search-admin-key: ${{ secrets.AZURE_SEARCH_KEY }}
